version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: coursewiser_postgres
    environment:
      POSTGRES_USER: coursewiser
      POSTGRES_PASSWORD: coursewiser123
      POSTGRES_DB: coursewiser
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coursewiser"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: coursewiser_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@coursewiser.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:

